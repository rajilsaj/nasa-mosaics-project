
    <html>
    <head>
        <title>LSTM Model LSTM Model Report</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 20px; }
            .container { max-width: 1200px; margin: 0 auto; }
            .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
            .metric-card { background: #f5f5f5; padding: 15px; border-radius: 5px; }
            .visualization { margin: 20px 0; }
            img { max-width: 100%; height: auto; }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>LSTM Model LSTM Model Report</h1>
            
            <h2>Model Metrics</h2>
            <div class="metrics">
                <div class="metric-card"><h3>Precision</h3><p>0.3575</p></div><div class="metric-card"><h3>Recall</h3><p>0.2958</p></div><div class="metric-card"><h3>F1-Score</h3><p>0.3238</p></div><div class="metric-card"><h3>AUC</h3><p>0.7937</p></div>
            </div>
            
            <h2>Visualizations</h2>
            <div class="visualization">
                <h3>Confusion Matrix</h3>
                <img src="confusion_matrix.png" alt="Confusion Matrix">
            </div>
            <div class="visualization">
                <h3>ROC Curve</h3>
                <img src="roc_curve.png" alt="ROC Curve">
            </div>
            <div class="visualization">
                <h3>Precision-Recall Curve</h3>
                <img src="precision_recall_curve.png" alt="Precision-Recall Curve">
            </div>
            <div class="visualization">
                <h3>Prediction Probability Distribution</h3>
                <img src="probability_distribution.png" alt="Probability Distribution">
            </div>
            <div class="visualization">
                <h3>Combined Metrics</h3>
                <img src="combined_metrics.png" alt="Combined Metrics">
            </div>
        </div>
    </body>
    </html>
